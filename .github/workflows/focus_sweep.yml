# .github/workflows/focus_sweep.yml
name: Focus Mode Sweep

on:
  schedule:
    - cron: "*/15 9-16 * * 1-5"   # every 15 min, Mon‑Fri, 09‑16 UTC (sweep)
    - cron: "0 14 * * 1-5"        # 14:00 UTC Mon‑Fri (nudge)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv (fast installer)
        run: curl -LsSf https://github.com/astral-sh/uv/releases/latest/download/uv-installer.sh | sh

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Write OAuth credentials (secret) to file
        env:
          CRED_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          echo "$CRED_JSON" > credentials.json

      - name: Write token.json (secret) to file
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          echo "$TOKEN_JSON" > token.json

      - name: Run sweep and optional nudge
        run: |
          echo "Running sweep"
          uv run focus_mode_local.py sweep > sweep.log 2>&1
          cat sweep.log

          # Run nudge only at 14:00 UTC (minute 00)
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          if [[ "$HOUR" == "14" && "$MIN" == "00" ]]; then
            echo "Running nudge"
            uv run focus_mode_local.py nudge
          else
            echo "Nudge not scheduled at this time"
          fi
