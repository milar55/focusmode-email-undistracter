# .github/workflows/focus_sweep.yml
name: Focus Mode Sweep

# Use Node.js 24 for JavaScript actions
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: "*/15 6-16 * * 1-5"
      timezone: "America/Los_Angeles"
    - cron: "0 17 * * 1-5"
      timezone: "America/Los_Angeles"
  workflow_dispatch:
    inputs:
      command:
        description: "Command to run (sweep, reverse, nudge)"
        required: true
        default: "sweep"
        type: choice
        options:
          - sweep
          - reverse
          - nudge

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv (fast installer)
        run: curl -LsSf https://github.com/astral-sh/uv/releases/latest/download/uv-installer.sh | sh

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Write OAuth credentials (secret) to file
        env:
          CRED_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          echo "$CRED_JSON" > credentials.json

      - name: Write token.json (secret) to file
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          echo "$TOKEN_JSON" > token.json

      - name: Run focus command
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CMD="${{ github.event.inputs.command }}"
          elif [ "${{ github.event.schedule }}" = "0 17 * * 1-5" ]; then
            CMD="reverse"
          else
            CMD="sweep"
          fi
          echo "Executing: uv run focus_mode_local.py $CMD"
          uv run focus_mode_local.py "$CMD"
          
      - name: Create Issue From File
        if: failure()
        uses: peter-evans/create-issue-from-file@v6.0.0
        with:
          title: "⚠️ Focus Mode Sweep Failed"
          content-filepath: .github/templates/sweep-failure.md
          token: ${{ secrets.GITHUB_TOKEN }}
