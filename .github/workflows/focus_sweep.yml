# .github/workflows/focus_sweep.yml
name: Focus Mode Sweep

# Use Node.js 24 for JavaScript actions
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: "*/15 9-16 * * 1-5"   # every 15 min Mon‑Fri 09‑16 UTC
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv (fast installer)
        run: curl -LsSf https://github.com/astral-sh/uv/releases/latest/download/uv-installer.sh | sh

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Write OAuth credentials (secret) to file
        env:
          CRED_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          echo "$CRED_JSON" > credentials.json

      - name: Write token.json (secret) to file
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          echo "$TOKEN_JSON" > token.json

      - name: Create issue on failure
        if: failure()
        uses: peter-evans/create-issue@v5
        with:
          title: "⚠️ Focus Mode Sweep Failed"
          body: |
            The scheduled sweep job failed on ${{ github.run_id }}.
            Please check the logs for details.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run sweep
        run: uv run focus_mode_local.py sweep
